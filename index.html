<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Area Callbook</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
:root{--red:#c0142f;--red-dark:#8f0f22;--white:#fff;--bg:#fff5f6;--gray:#666}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Arial,sans-serif;background:var(--bg);color:#222}
header{background:var(--red);color:var(--white);padding:12px 16px;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px}
header img{height:36px;width:36px;border-radius:8px;background:var(--white);object-fit:contain}
header h1{margin:0;font-size:1.1rem}
#tabs{display:flex;gap:6px;overflow-x:auto;padding:10px;background:var(--white);border-bottom:2px solid var(--red)}
.tab{flex:0 0 auto;padding:8px 14px;border:1px solid var(--red);border-radius:20px;background:var(--white);color:var(--red);cursor:pointer;font-weight:600;white-space:nowrap;transition:.2s}
.tab.active{background:var(--red);color:var(--white)}
#areaTitle{max-width:700px;margin:10px auto 0;padding:0 10px;color:var(--red-dark);font-weight:700}
#list{padding:10px;max-width:700px;margin:0 auto}
.card{background:var(--white);border:1px solid #f2c6cd;border-left:5px solid var(--red);border-radius:10px;padding:10px 14px;margin-bottom:10px;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.card .name{font-weight:700}
.card .num{color:var(--gray);font-size:.9rem;margin-bottom:8px}
.remarks{background:var(--bg);border:1px dashed #f2c6cd;border-radius:6px;padding:4px 8px;font-size:.85rem;color:var(--red-dark);margin-bottom:8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{border:none;border-radius:6px;padding:8px 12px;font-weight:600;cursor:pointer;flex:1;min-width:90px;transition:transform .12s,opacity .12s}
button:active{transform:scale(.96)}
.callBtn{background:var(--red);color:var(--white)}
.ok{background:#e6f7e9;color:#137333}
.fail{background:#fdeaea;color:var(--red-dark)}
.status{font-size:.85rem;margin-top:6px;font-weight:600}
.status.success{color:#137333}
.status.failure{color:var(--red-dark)}
.note{width:100%;margin-top:8px;border:1px solid #f2c6cd;border-radius:6px;padding:6px 8px;font-size:.85rem;resize:vertical;min-height:36px;font-family:inherit;transition:border-color .2s}
.note:focus{outline:none;border-color:var(--red)}
.saved{font-size:.7rem;color:#137333;opacity:0;transition:opacity .3s}
.saved.show{opacity:1}
.sl{color:var(--gray);font-size:.85rem;margin-right:6px}
#cfg{padding:14px;max-width:700px;margin:10px auto;background:var(--white);border:2px solid var(--red);border-radius:10px}
#cfg label{display:block;font-weight:700;color:var(--red);margin-bottom:6px}
#cfg .hint{font-size:.75rem;color:var(--gray);margin:4px 0 10px}
</style>
</head>
<body>
<header>
<img src="https://placehold.co/72x72/ffffff/c0142f?text=LOGO" alt="logo" id="logo">
<h1>📞 Area Callbook</h1>
</header>

<!-- <div id="cfg">
<label>ℹ️ CSV links are set inside the code (see CSV_LINKS array in &lt;script&gt;)</label>
<div class="hint">Each sheet needs columns: SlNo, Zone, Area, Name, Number, Remarks</div> -->
<button class="callBtn" onclick="loadAll()">🔄 Refresh Data</button>
<!-- </div> -->

<div id="tabs"></div>
<div id="areaTitle"></div>
<div id="list"></div>

<script>
const ZONES=["1","2","3","4","5","6(A)","6(B)","7","8(A)","8(B)"];
const LS_STATUS="cb_status", LS_NOTES="cb_notes", LS_DATA="cb_area_data";

// ===== PASTE YOUR 10 PUBLISHED CSV LINKS HERE (one per zone) =====
const CSV_LINKS=[
"https://docs.google.com/spreadsheets/d/e/LINK1/pub?output=csv",
"https://docs.google.com/spreadsheets/d/e/LINK2/pub?output=csv",
"https://docs.google.com/spreadsheets/d/e/LINK3/pub?output=csv",
"https://docs.google.com/spreadsheets/d/e/LINK4/pub?output=csv",
"https://docs.google.com/spreadsheets/d/e/2PACX-1vQVqUhd7nkA4g92wJ0mqWun4RYyJYLPJjZXekZgoFYEfNQWKpG15iVnWCxqbjo1hQswGcC2DSvDOQH1/pub?output=csv",
"https://docs.google.com/spreadsheets/d/e/LINK6/pub?output=csv",
"https://docs.google.com/spreadsheets/d/e/LINK7/pub?output=csv",
"https://docs.google.com/spreadsheets/d/e/LINK8/pub?output=csv",
"https://docs.google.com/spreadsheets/d/e/LINK9/pub?output=csv",
"https://docs.google.com/spreadsheets/d/e/LINK10/pub?output=csv"
];
// ===================================================

let contacts=[], activeZone=ZONES[0];
const savedData = localStorage.getItem(LS_DATA);
if(savedData){ contacts = JSON.parse(savedData); }

function getStatus(){ return JSON.parse(localStorage.getItem(LS_STATUS)||"{}"); }
function setStatus(num, val){
  const s=getStatus(); s[num]={status:val, time:new Date().toLocaleString()};
  localStorage.setItem(LS_STATUS, JSON.stringify(s));
  render();
}
function getNotes(){ return JSON.parse(localStorage.getItem(LS_NOTES)||"{}"); }
function saveNote(num, val, badgeEl){
  const n=getNotes(); n[num]=val;
  localStorage.setItem(LS_NOTES, JSON.stringify(n));
  if(badgeEl){ badgeEl.classList.add('show'); setTimeout(()=>badgeEl.classList.remove('show'),1000); }
}

async function loadAll(){
  const links = CSV_LINKS.filter(l=>l && !l.includes("LINK")).slice(0,10);
  let all=[];
  for(const url of links){
    try{
      const res = await fetch(url);
      const text = await res.text();
      const parsed = Papa.parse(text, {header:true, skipEmptyLines:true});
      parsed.data.forEach(r=>{
        all.push({
          sl:(r.SlNo||r.slno||r["Sl No"]||r["Sl.No"]||"").toString().trim(),
          zone:(r.Zone||r.zone||"").toString().trim(),
          area:(r.Area||r.area||"").toString().trim(),
          name:(r.Name||r.name||"").trim(),
          number:(r.Number||r.number||"").toString().trim(),
          remarks:(r.Remarks||r.remarks||"").toString().trim()
        });
      });
    }catch(e){ console.warn("Failed to load", url, e); }
  }
  contacts = all.filter(c=>c.number);
  localStorage.setItem(LS_DATA, JSON.stringify(contacts));
  render();
}

function renderTabs(){
  document.getElementById('tabs').innerHTML = ZONES.map(z=>
    `<div class="tab ${z===activeZone?'active':''}" onclick="selectZone('${z}')">Zone ${z}</div>`
  ).join("");
}
function selectZone(z){ activeZone=z; render(); }

function render(){
  renderTabs();
  const status=getStatus(), notes=getNotes();
  const items=contacts.filter(c=>c.zone===activeZone);
  const areaName = items[0]?.area || "";
  document.getElementById('areaTitle').textContent = areaName ? `📍 Area: ${areaName}` : "";
  const listEl=document.getElementById('list');
  if(!items.length){ listEl.innerHTML="<p>No contacts found for this zone.</p>"; return; }
  listEl.innerHTML = items.map((c,i)=>{
    const st=status[c.number];
    const noteVal = notes[c.number] || "";
    return `<div class="card">
      <div class="name"><span class="sl">${c.sl?("#"+c.sl):""}</span>${c.name||"Unnamed"}</div>
      <div class="num">${c.number}</div>
      ${c.remarks?`<div class="remarks">📝 ${c.remarks}</div>`:""}
      <div class="row">
        <a href="tel:${c.number}"><button class="callBtn">📞 Call</button></a>
        <button class="ok" onclick="setStatus('${c.number}','success')">✅ Success</button>
        <button class="fail" onclick="setStatus('${c.number}','failure')">❌ Failure</button>
      </div>
      ${st?`<div class="status ${st.status}">${st.status.toUpperCase()} — ${st.time}</div>`:""}
      <textarea class="note" placeholder="Note about dealer..." data-num="${c.number}" oninput="handleNote(this)">${noteVal}</textarea>
      <span class="saved" id="saved_${i}_${activeZone}">Saved ✓</span>
    </div>`;
  }).join("");
}

let noteTimers={};
function handleNote(el){
  const num=el.dataset.num;
  clearTimeout(noteTimers[num]);
  noteTimers[num]=setTimeout(()=>{
    const badge = el.parentElement.querySelector('.saved');
    saveNote(num, el.value, badge);
  }, 500);
}

render();
loadAll();
</script>
</body>
</html>
